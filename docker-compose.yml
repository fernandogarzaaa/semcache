# Full local stack: proxy + deterministic mock LLM + Prometheus + Grafana.
#   docker compose up --build          -> proxy on :8080, Grafana on :3000, Prometheus on :9090
#   SEMCACHE_UPSTREAM_URL=https://api.openai.com/v1 docker compose up   -> real provider (key from the app)
#   docker compose --profile ollama up -> adds Ollama on :11434 for a free local model
services:
  semcache:
    build:
      context: .
      args:
        LOCAL_EMBEDDINGS: "${LOCAL_EMBEDDINGS:-0}"
    ports: ["8080:8080"]
    environment:
      SEMCACHE_UPSTREAM_URL: "${SEMCACHE_UPSTREAM_URL:-http://mock:9000/v1}"
      SEMCACHE_EMBEDDER: "${SEMCACHE_EMBEDDER:-hashing}"
      SEMCACHE_INDEX: auto
      SEMCACHE_ADMIN_TOKEN: "${SEMCACHE_ADMIN_TOKEN:-}"
    depends_on: [mock]

  mock:
    build: .
    command: ["mock-upstream", "--host", "0.0.0.0", "--port", "9000", "--latency-ms", "300", "--jitter-ms", "600"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [semcache]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
